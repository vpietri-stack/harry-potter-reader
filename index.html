<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152922">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HP Reader">
  <title>The Boy Who Lived · Chapter Reader</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="reader.css?v=9">
  <script defer src="chapter.js?v=4"></script>
  <script defer src="word-audio.js?v=4"></script>
  <script defer src="sentence-parts.js?v=7"></script>
  <script defer src="reader.js?v=9"></script>
  <script defer src="notes_speech.js?v=10"></script>
  <script defer src="pwa-install.js?v=1"></script>
</head>
<body>
  <header class="book-header">
    <div class="measure">
      <p class="book" lang="en">Harry Potter and the Sorcerer’s Stone</p>
      <h1 lang="en">The Boy Who Lived</h1>
      <p class="chapter">第一章 · 大难不死的男孩</p>
      <button id="install-app" class="install-btn" type="button" aria-expanded="false" hidden>安装到主屏幕 · Install App</button>
      <div id="install-guide" class="install-guide" hidden role="region" aria-label="安装说明">
        <button id="install-guide-close" class="install-guide-close" type="button" aria-label="关闭安装说明">×</button>
        <p><strong>在 iPhone / iPad Safari 中安装：</strong></p>
        <p>1. 点击浏览器工具栏的 <strong>分享</strong> 按钮（方框带向上箭头）。</p>
        <p>2. 向下滑动并点击 <strong>添加到主屏幕</strong>，然后点 <strong>添加</strong>。</p>
        <p class="install-guide-en">In Safari: tap <strong>Share</strong>, then tap <strong>Add to Home Screen</strong>.</p>
      </div>
    </div>
  </header>
  <main class="measure">
    <p class="hint">点句子听朗读。点下方的词语可单独听发音，带下划线的词语还可高亮对应中文。</p>
    <article id="chapter" aria-label="第一章正文" lang="en"></article>
  </main>
  <aside class="player" aria-label="句子朗读和跟读">
    <div class="selection" aria-live="polite">
      <p id="nowPlaying"></p>
      <p id="translation">选择一句话开始。</p>
    </div>
    <div id="sentence-parts" class="sentence-parts" role="group" aria-label="分段听" hidden>
      <small>分段听</small>
      <div id="part-buttons"></div>
    </div>
    <div class="playback">
      <label>语速
        <select id="rate" aria-label="语速">
          <option value=".6">超慢</option>
          <option value=".75">慢速</option>
          <option value="1" selected>正常</option>
          <option value="1.15">稍快</option>
        </select>
      </label>
      <button id="replay" type="button" disabled>再听整句</button>
      <button id="stop" type="button" disabled>停止</button>
      <small id="playback-status" role="status"></small>
    </div>
  </aside>
</body>
</html>
